[manifest]
version = "1.0.0"
dump_lua = true
priority = 1

# adds calc_scaling functionality to blinds
[[patches]]
[patches.pattern]
target = '=[SMODS _ "src/utils.lua"]'
pattern = '''
                if ret.post then ret.post.source = card; scaling_responses[#scaling_responses + 1] = ret.post end
                SMODS.calculate_effect(ret, card)
            end
        end
    end
'''
position = "after"
payload = '''
if G.GAME.blind.config.blind.calc_scaling and type(G.GAME.blind.config.blind.calc_scaling) == "function" then
    local ret = G.GAME.blind.config.blind:calc_scaling(G.GAME.blind.config.blind, card, initial, scalar_value, args)
    if ret then
        if ret.override_value and not args.block_overrides.value then initial = ret.override_value.value; SMODS.calculate_effect(ret.override_value, G.GAME.blind.config.blind) end
        if ret.override_scalar_value and not args.block_overrides.scalar then scalar_value = ret.override_scalar_value.value; SMODS.calculate_effect(ret.override_scalar_value, G.GAME.blind.config.blind) end
        if ret.override_message and not args.block_overrides.message then scaling_message = SMODS.merge_defaults(ret.override_message, scaling_message) end
        if ret.post then ret.post.source = G.GAME.blind.config.blind; scaling_responses[#scaling_responses + 1] = ret.post end
        SMODS.calculate_effect(ret, G.GAME.blind.config.blind)
    end
end
'''
match_indent = true

# adds voided functionality (dont trigger joker effects)
[[patches]]
[patches.pattern]
target = '=[SMODS _ "src/utils.lua"]'
pattern = '''
if next(effects) then
'''
position = "at"
payload = '''
if next(effects) and not card.ability.ven_voided then
'''
match_indent = true

# adds the door functionality (only highest card scores)
[[patches]]
[patches.pattern]
target = '=[SMODS _ "src/overrides.lua"]'
pattern = '''
		scoring_hand = poker_hands[v][1]
		break
	end
end
'''
position = "after"
payload = '''
if G.GAME.modifiers.ven_only_high_card_scores then
    scoring_hand = poker_hands['High Card'][1]
end
'''
match_indent = true

# adds the knuckle functionality (disable retriggers)
[[patches]]
[patches.pattern]
target = '=[SMODS _ "src/utils.lua"]'
pattern = '''
if reps[j] == 1 and flags.calculated then
'''
position = "at"
payload = '''
if reps[j] == 1 and flags.calculated and not G.GAME.modifiers.ven_no_retriggers then
'''
match_indent = true

# adds the cat functionality (trigger cards as if held in hand)
[[patches]]
[patches.pattern]
target = '=[SMODS _ "src/utils.lua"]'
pattern = '''
function SMODS.score_card(card, context)
'''
position = "after"
payload = '''
if G.GAME.modifiers.ven_all_cards_in_hand then
    context.cardarea = G.hand
end
'''
match_indent = true

# track cards that are debuffed
[[patches]]
[patches.pattern]
target = 'functions/common_events.lua'
pattern = '''
    local drawn = nil
'''
position = "after"
payload = '''
if card then
    if card.debuff and to == G.hand then card.ability.ven_has_been_debuffed = true end
end
'''
match_indent = true

# adds the... blind? functionality (remove small and big blinds when created)
[[patches]]
[patches.pattern]
target = 'functions/UI_definitions.lua'
pattern = '''
if not run_info then G.GAME.round_resets.blind_states[G.GAME.blind_on_deck] = 'Select' end
'''
position = "before"
payload = '''
if G.P_BLINDS[G.GAME.round_resets.blind_choices["Boss"]].key == "bl_ven_the_blind" then
    G.GAME.blind_on_deck = 'Boss'
    if type == "Small" or type == "Big" then
        G.GAME.round_resets.blind_states[type] = 'Hide'
    end
end
'''
match_indent = true
[[patches]]
[patches.pattern]
target = 'functions/UI_definitions.lua'
pattern = '''
G.blind_select_opts.small = G.GAME.round_resets.blind_states['Small'] ~= 'Hide' and UIBox{definition = {n=G.UIT.ROOT, config={align = "cm", colour = G.C.CLEAR}, nodes={UIBox_dyn_container({create_UIBox_blind_choice('Small')},false,get_blind_main_colour('Small'))}}, config = {align="bmi", offset = {x=0,y=0}}} or nil
G.blind_select_opts.big = G.GAME.round_resets.blind_states['Big'] ~= 'Hide' and UIBox{definition = {n=G.UIT.ROOT, config={align = "cm", colour = G.C.CLEAR}, nodes={UIBox_dyn_container({create_UIBox_blind_choice('Big')},false,get_blind_main_colour('Big'))}}, config = {align="bmi", offset = {x=0,y=0}}} or nil
G.blind_select_opts.boss = G.GAME.round_resets.blind_states['Boss'] ~= 'Hide' and UIBox{definition = {n=G.UIT.ROOT, config={align = "cm", colour = G.C.CLEAR}, nodes={UIBox_dyn_container({create_UIBox_blind_choice('Boss')},false,get_blind_main_colour('Boss'), mix_colours(G.C.BLACK, get_blind_main_colour('Boss'), 0.8))}}, config = {align="bmi", offset = {x=0,y=0}}} or nil
'''
position = "at"
payload = '''
if G.P_BLINDS[G.GAME.round_resets.blind_choices["Boss"]].key == "bl_ven_the_blind" then
G.blind_select_opts.small = G.GAME.round_resets.blind_states['Small'] ~= 'Hide' and UIBox{definition = {n=G.UIT.ROOT, config={align = "cm", colour = G.C.CLEAR}, nodes={}}, config = {align="bmi", offset = {x=0,y=0}}} or nil
    G.blind_select_opts.big = G.GAME.round_resets.blind_states['Big'] ~= 'Hide' and UIBox{definition = {n=G.UIT.ROOT, config={align = "cm", colour = G.C.CLEAR}, nodes={}}, config = {align="bmi", offset = {x=0,y=0}}} or nil
    G.blind_select_opts.boss = G.GAME.round_resets.blind_states['Boss'] ~= 'Hide' and UIBox{definition = {n=G.UIT.ROOT, config={align = "cm", colour = G.C.CLEAR}, nodes={UIBox_dyn_container({create_UIBox_blind_choice('Boss')},false,get_blind_main_colour('Boss'), mix_colours(G.C.BLACK, get_blind_main_colour('Boss'), 0.8))}}, config = {align="bmi", offset = {x=0,y=0}}} or nil
else
    G.blind_select_opts.small = G.GAME.round_resets.blind_states['Small'] ~= 'Hide' and UIBox{definition = {n=G.UIT.ROOT, config={align = "cm", colour = G.C.CLEAR}, nodes={UIBox_dyn_container({create_UIBox_blind_choice('Small')},false,get_blind_main_colour('Small'))}}, config = {align="bmi", offset = {x=0,y=0}}} or nil
    G.blind_select_opts.big = G.GAME.round_resets.blind_states['Big'] ~= 'Hide' and UIBox{definition = {n=G.UIT.ROOT, config={align = "cm", colour = G.C.CLEAR}, nodes={UIBox_dyn_container({create_UIBox_blind_choice('Big')},false,get_blind_main_colour('Big'))}}, config = {align="bmi", offset = {x=0,y=0}}} or nil
    G.blind_select_opts.boss = G.GAME.round_resets.blind_states['Boss'] ~= 'Hide' and UIBox{definition = {n=G.UIT.ROOT, config={align = "cm", colour = G.C.CLEAR}, nodes={UIBox_dyn_container({create_UIBox_blind_choice('Boss')},false,get_blind_main_colour('Boss'), mix_colours(G.C.BLACK, get_blind_main_colour('Boss'), 0.8))}}, config = {align="bmi", offset = {x=0,y=0}}} or nil
end
'''
match_indent = true

# silver sword and gate parrying
[[patches]]
[patches.pattern]
target = 'game.lua'
pattern = '''
G.STATE = G.STATES.NEW_ROUND
'''
position = "at"
payload = '''
if G.GAME.chips - G.GAME.blind.chips >= 0 and G.GAME.modifiers.ven_parry_enabled then
    ven_parry()
    G.STATE = G.STATES.DRAW_TO_HAND
else
    G.STATE = G.STATES.NEW_ROUND
end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = 'game.lua'
pattern = '''
    G.STATE = G.STATES.DRAW_TO_HAND
end
'''
position = "before"
payload = '''
if G.GAME.modifiers.ven_parry_after_hand_enabled then
    ven_parry()
end
'''
match_indent = true